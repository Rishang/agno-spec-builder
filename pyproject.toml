[project]
name = "agno-spec-builder"
version = "0.1.0"
description = "Build Agno agents, teams, workflows, skills, MCP tools, and knowledge from declarative specs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "a2a-sdk>=1.1.1",
    "agno[os,sqlite]==2.7.2",
    "cel-python==0.5.0",
    "fastapi==0.139.0",
    "jmespath==1.1.0",
    "mcp==1.28.1",
    "openai>=2.46.0",
    "pydantic[email]==2.13.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
ag-ui = ["ag-ui-protocol>=0.1.19"]
dev = ["ruff==0.15.20"]

[project.scripts]
agno-spec-builder = "agno_spec_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agno_spec_builder"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
